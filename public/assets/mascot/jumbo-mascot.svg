<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Jumbo mascot placeholder">
  <title>Jumbo AI mascot — placeholder artwork</title>
  <defs>
    <linearGradient id="m-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B57BFF"/>
      <stop offset="0.55" stop-color="#6E7BFF"/>
      <stop offset="1" stop-color="#46C8F5"/>
    </linearGradient>
  </defs>
  <!-- antenna -->
  <path d="M256 96V60" stroke="url(#m-skin)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="48" r="16" fill="#92E82A"/>
  <!-- head -->
  <rect x="96" y="96" width="320" height="290" rx="130" fill="url(#m-skin)" opacity="0.22"/>
  <rect x="96" y="96" width="320" height="290" rx="130" fill="none" stroke="url(#m-skin)" stroke-width="10"/>
  <!-- face -->
  <circle cx="204" cy="222" r="20" fill="#F2F4F1"/>
  <circle cx="308" cy="222" r="20" fill="#F2F4F1"/>
  <path d="M206 288c14 18 34 27 50 27s36-9 50-27" stroke="#F2F4F1" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- replace-me ring -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#92E82A" stroke-width="4" stroke-dasharray="14 16" opacity="0.5"/>
  <text x="256" y="446" fill="#7C817B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" letter-spacing="3" text-anchor="middle">MASCOT PLACEHOLDER</text>
